<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Wishes 🎉</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <canvas id="confetti"></canvas>
        
        <!-- Home Screen -->
        <div id="home" class="screen active">
            <div class="home-content">
                <h1 class="title">🎂 Birthday Wishes 🎂</h1>
                <p class="subtitle">Send love and wishes to your friends</p>
                <button class="btn btn-primary" onclick="showScreen('friends')">View Friends →</button>
            </div>
        </div>

        <!-- Friends List Screen -->
        <div id="friends" class="screen">
            <div class="screen-content">
                <div class="header">
                    <button class="btn-back" onclick="showScreen('home')">← Back</button>
                    <h2>Birthday Buddies 👯</h2>
                </div>
                <div id="friendsList" class="friends-list">
                    <!-- Friends will be populated here -->
                </div>
                <button class="btn btn-secondary" onclick="showScreen('add-friend')">+ Add Friend</button>
            </div>
        </div>

        <!-- Add Friend Screen -->
        <div id="add-friend" class="screen">
            <div class="screen-content">
                <div class="header">
                    <button class="btn-back" onclick="showScreen('friends')">← Back</button>
                    <h2>Add Birthday Friend</h2>
                </div>
                <form id="friendForm" class="form">
                    <div class="form-group">
                        <label for="friendName">Name:</label>
                        <input type="text" id="friendName" placeholder="Enter name" required>
                    </div>
                    <div class="form-group">
                        <label for="friendBirthdate">Birthday (MM-DD):</label>
                        <input type="text" id="friendBirthdate" placeholder="MM-DD" pattern="\d{2}-\d{2}" required>
                    </div>
                    <div class="form-group">
                        <label for="friendColor">Color:</label>
                        <div class="color-picker">
                            <input type="color" id="friendColor" value="#FF6B9D">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Friend</button>
                </form>
            </div>
        </div>

        <!-- Wish Screen -->
        <div id="wish" class="screen">
            <div class="screen-content">
                <div class="header">
                    <button class="btn-back" onclick="showScreen('friends')">← Back</button>
                </div>
                <div id="wishContent" class="wish-content">
                    <!-- Wish details will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script src="confetti.js"></script>
    <script src="script.js"></script>
</body>
</html>
